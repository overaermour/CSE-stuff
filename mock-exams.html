nt.","model":"First generation used vacuum tubes. Second generation replaced them with transistors, generally reducing heat/power and increasing reliability.","rubric":["Names vacuum tubes for the first generation and transistors for the second","Explains an advantage such as reduced heat/size/power or improved reliability"]},{"id":"e1-short-2","topic":"theory","question":"Differentiate computability theory from complexity theory, giving the main question each investigates.","model":"Computability asks whether any algorithm can solve a problem for all inputs. Complexity asks how much time or memory solving a computable problem requires.","rubric":["Correctly describes whether problems are algorithmically solvable","Correctly describes resource use such as time or space"]},{"id":"e1-short-3","topic":"data","question":"Convert 110101₂ to decimal and show how you used place values.","model":"110101₂ = 32 + 16 + 4 + 1 = 53₁₀.","rubric":["Uses appropriate powers of two or equivalent workings","Gives the final answer 53"]}]},{"id":"test-2","name":"Generations & Origins","description":"Trace the people, machines and breakthroughs","level":"Core","mc":[{"id":"e2-mc-history-1","topic":"history","question":"What input medium did the Jacquard loom famously use to control patterns?","options":["Punched cards","Magnetic tape","Optical disks","USB drives"],"answer":0,"explanation":"Punched cards encoded weaving patterns and inspired later programmable systems."},{"id":"e2-mc-theory-1","topic":"theory","question":"Which model is used as a general mathematical abstraction of computation?","options":["Slide rule","Router","Monitor","Turing machine"],"answer":3,"explanation":"A Turing machine provides a formal model for algorithms and computability."},{"id":"e2-mc-models-1","topic":"models","question":"What is the primary job of the control unit?","options":["Directing the fetch-decode-execute process","Providing internet connectivity","Making printed paper","Storing all external backups"],"answer":0,"explanation":"The control unit coordinates instruction processing."},{"id":"e2-mc-ai-1","topic":"ai","question":"What is unsupervised learning?","options":["Receiving reward signals only","Translating assembly to machine code","Learning only from exam answers","Discovering structure in data without target labels"],"answer":3,"explanation":"Unsupervised learning can find clusters or patterns."},{"id":"e2-mc-internet-1","topic":"internet","question":"What was the famous first ARPANET transmission?","options":["HELLO WORLD","HTTP","WWW","LO"],"answer":3,"explanation":"An attempted LOGIN crashed after the first two letters: LO."},{"id":"e2-mc-data-1","topic":"data","question":"How many distinct values can 8 bits represent?","options":["1024","8","128","256"],"answer":3,"explanation":"Two possibilities per bit gives 2⁸ = 256."},{"id":"e2-mc-history-2","topic":"history","question":"What did Herman Hollerith's tabulating system speed up?","options":["Routing IP packets","Processing census data","Rendering 3D graphics","Training neural networks"],"answer":1,"explanation":"Hollerith used punched-card equipment in the 1890 US census."},{"id":"e2-mc-theory-2","topic":"theory","question":"Which machine has a finite set of states and no unbounded tape memory?","options":["Universal Turing machine","Finite automaton","Stored-program computer","Smartphone"],"answer":1,"explanation":"Finite automata have limited state memory."},{"id":"e2-mc-models-2","topic":"models","question":"What is the stored-program principle?","options":["Computers cannot modify instructions","Programs must be wired permanently","Data and instructions can be stored in addressable memory","Only paper tape is used"],"answer":2,"explanation":"Stored programs place machine instructions in memory alongside data."},{"id":"e2-mc-ai-2","topic":"ai","question":"What is reinforcement learning?","options":["An agent learns through rewards or penalties from interactions","A database copying files","A estion":"Which two researchers are widely credited with key TCP/IP design work?","options":["Vint Cerf and Bob Kahn","Ada Lovelace and Charles Babbage","Blaise Pascal and Leibniz","Bill Gates and Steve Jobs"],"answer":0,"explanation":"Cerf and Kahn were central to early TCP/IP design."},{"id":"e2-mc-data-3","topic":"data","question":"What is decimal 25 in hexadecimal?","options":["1F","25","2A","19"],"answer":3,"explanation":"25 = 1×16 + 9, so 19₁₆."},{"id":"e2-mc-history-4","topic":"history","question":"Which drawback was especially associated with vacuum-tube computers?","options":["Dependence on Wi-Fi","No ability to perform arithmetic","High heat and power use","Mandatory touchscreen input"],"answer":2,"explanation":"Vacuum tubes generated substantial heat and were failure-prone."},{"id":"e2-mc-data-4","topic":"data","question":"What is octal 17 in decimal?","options":["15","14","17","16"],"answer":0,"explanation":"1×8 + 7 = 15."}],"matching":[{"id":"e2-match-theory-2","topic":"theory","term":"Finite automaton","definition":"Machine with finitely many states and no stack"},{"id":"e2-match-models-1","topic":"models","term":"Input alphabet","definition":"Symbols a state machine can read"},{"id":"e2-match-theory-1","topic":"theory","term":"Complexity theory","definition":"Study of computational resource requirements"},{"id":"e2-match-models-2","topic":"models","term":"Start state","definition":"Designated initial state of an automaton"},{"id":"e2-match-history-1","topic":"history","term":"Jacquard loom","definition":"Used punched cards to select weaving patterns"},{"id":"e2-match-data-1","topic":"data","term":"Binary","definition":"Base-two positional numeral system"},{"id":"e2-match-internet-1","topic":"internet","term":"Charley Kline","definition":"Sent the first attempted ARPANET login from UCLA"},{"id":"e2-match-history-2","topic":"history","term":"Difference Engine","definition":"Proposed automatic calculator for mathematical tables"},{"id":"e2-match-internet-2","topic":"internet","term":"Packet switching","definition":"Moving data as individually transmitted packets"},{"id":"e2-match-data-2","topic":"data","term":"Octal","definition":"Base-eight positional numeral system"},{"id":"e2-match-ai-1","topic":"ai","term":"Supervised learning","definition":"Training with labeled examples"},{"id":"e2-match-ai-2","topic":"ai","term":"Unsupervised learning","definition":"Discovering structure without target labels"}],"short":[{"id":"e2-short-1","topic":"models","question":"Describe the roles of the program counter and the control unit in the fetch-decode-execute cycle.","model":"The program counter holds the address of the next instruction; the control unit fetches/decodes instructions and coordinates their execution.","rubric":["Correct role of program counter","Correct role of control unit"]},{"id":"e2-short-2","topic":"ai","question":"Contrast supervised and unsupervised machine learning with one example of each.","model":"Supervised learning uses labeled examples (e.g. spam vs legitimate email); unsupervised learning discovers patterns without labels (e.g. customer clustering).","rubric":["Describes supervised learning and gives an appropriate example","Describes unsupervised learning and gives an appropriate example"]},{"id":"e2-short-3","topic":"internet","question":"Explain why the Internet and World Wide Web are not interchangeable terms.","model":"The Internet is the global network of networks based on IP. The Web is a service using Internet connectivity, HTTP and linked web resources.","rubric":["Identifies the Internet as networking infrastructure","Identifies the Web as a service using the Internet, e.g. HTTP/web pages"]}]},{"id":"test-3","name":"Theory in Action","description":"Apply computation models and conversions","level":"Core","mc":[{"id":"e3-mc-history-1","topic":"history","question":"What technological shift defines the second generation of computers?","options":["Transistors largely replacing vacuum tubes","Quantum bits replacing bytes","Microprocessors replacing CPUs","Internet replacing main memory"],"answer":0,"explanation":"Transistors improved size, reliability and energy use."},{"id":"e3-mc-theory-1","topic":"theory","question":"Which concept establishes that some problems have no general algorithmic solution?","options":["Clock speed","Screen resolution","Undecidability","Compression ratio"],"answer":2,"explanation":"An undecidable problem cannot be solved by an algorithm for every valid input."},{"id":"e3-mc-models-1","topic":"models","question":"What does the program counter ordinarily hold?","options":["Total number of user accounts","CPU temperature","Address of the next instruction to fetch","The current screen resolution"],"answer":2,"explanation":"The program counter tracks which instruction is fetched next."},{"id":"e3-mc-ai-1","topic":"ai","question":"What is computer vision?","options":["Computer keyboard repair","Converting binary to octal","Extracting meaning from images or video","Storing a DNS record"],"answer":2,"explanation":"Vision systems interpret visual information."},{"id":"e3-mc-internet-1","topic":"internet","question":"Which date marks ARPANET's switch to TCP/IP protocols?","options":["1 January 1983","25 December 1999","1 January 1960","4 July 2005"],"answer":0,"explanation":"January 1, 1983 is commonly called TCP/IP flag day."},{"id":"e3-mc-data-1","topic":"data","question":"Which numbering system has base 2?","options":["Octal","Binary","Decimal","Hexadecimal"],"answer":1,"explanation":"Binary uses digits 0 and 1."},{"id":"e3-mc-history-2","topic":"history","question":"Why were transistors advantageous compared with vacuum tubes?","options":["They were smaller and generally more reliable","They eliminated software bugs","They only supported binary-coded decimal","They needed more cooling"],"answer":0,"explanation":"Transistors lowered heat, size and maintenance demands."},{"id":"e3-mc-theory-2","topic":"theory","question":"What does th  machine algorithm"},{"id":"e3-match-internet-2","topic":"internet","term":"Bob Kahn","definition":"Pioneer of open-architecture internetworking and TCP/IP"},{"id":"e3-match-data-2","topic":"data","term":"Hexadecimal","definition":"Base-sixteen positional numeral system"},{"id":"e3-match-ai-2","topic":"ai","term":"Natural language processing","definition":"Computational processing of human language"},{"id":"e3-match-data-1","topic":"data","term":"Decimal","definition":"Base-ten positional numeral system"},{"id":"e3-match-history-1","topic":"history","term":"Analytical Engine","definition":"Babbage's design for a programmable general-purpose machine"},{"id":"e3-match-internet-1","topic":"internet","term":"Vint Cerf","definition":"Co-author of early TCP/IP technical specifications"},{"id":"e3-match-theory-1","topic":"theory","term":"Turing machine","definition":"Abstract machine with a potentially unbounded tape"},{"id":"e3-match-models-1","topic":"models","term":"Accepting state","definition":"State that accepts a string if input ends there"},{"id":"e3-match-theory-2","topic":"theory","term":"Regular language","definition":"Language recognizable by finite automata"},{"id":"e3-match-ai-1","topic":"ai","term":"Reinforcement learning","definition":"Learning a policy using reward feedback"}],"short":[{"id":"e3-short-1","topic":"history","question":"How did punched cards contribute to the development of programmable machines? Refer to one historical example.","model":"Punched cards encoded instructions or data as hole patterns, e.g. the Jacquard loom controlled weaving patterns or Hollerith cards stored census data.","rubric":["Explains encoding by hole patterns for instructions or data","Gives Jacquard or Hollerith with correct function"]},{"id":"e3-short-2","topic":"models","question":"Model a turnstile with Locked and Unlocked states. Give the transitions for inserting a coin while Locked and pushing while Unlocked.","model":"Locked + coin -> Unlocked; Unlocked + push pt in generative AI?","options":["An electrical fault signal","An IP address class","A type of memory chip","Input instructions or context supplied to a model"],"answer":3,"explanation":"Prompts shape the model's requested task and response."},{"id":"e5-mc-internet-3","topic":"internet","question":"What does URL stand for?","options":["User Registry Link","Unified RAM Layout","Universal Routing Language","Uniform Resource Locator"],"answer":3,"explanation":"A URL identifies the location of a resource."},{"id":"e5-mc-data-3","topic":"data","question":"Which of these describes UTF-8 correctly?","options":["A variable-length Unicode encoding using 1 to 4 bytes","An encoding that always uses exactly 8 bytes per character","A bitmap-only image format","A purely numeric base-8 system"],"answer":0,"explanation":"UTF-8 encodes Unicode code points in one to four bytes."},{"id":"e5-mc-history-4","topic":"history","question":"What made the Difference Engine concept useful?","options":["Providing wireless connectivity","Replacing email protocols","Automating the calculation of mathematical tables","Recognizing faces"],"answer":2,"explanation":"Babbage envisioned calculating and printing tables to reduce human errors."},{"id":"e5-mc-data-4","topic":"data","question":"Why can UTF-8 store standard ASCII characters compactly?","options":["They always use four bytes","They require a separate font chip","Their UTF-8 representation uses one byte","They cannot be represented"],"answer":2,"explanation":"ASCII code points use one-byte UTF-8 sequences."}],"matching":[{"id":"e5-match-internet-2","topic":"internet","term":"DNS","definition":"Distributed system linking domain names to resource records"},{"id":"e5-match-models-1","topic":"models","term":"ALU","definition":"Unit performing arithmetic and logical operations"},{"id":"e5-match-theory-1","topic":"theory","term":"DFA","definition":"Automaton with one transition per state and symbol"},{"id":"e5-match-history-1","topic":"history","te uum tubes","It expanded academic networking in the United States","It invented the Pascaline","It replaced binary encoding"],"answer":1,"explanation":"NSFNET was a major networking backbone during Internet growth."},{"id":"e6-mc-data-2","topic":"data","question":"Which binary string represents decimal 7?","options":["110","100","101","111"],"answer":3,"explanation":"7 = 4 + 2 + 1."},{"id":"e6-mc-history-3","topic":"history","question":"What is Grace Hopper especially known for?","options":["Inventing TCP/IP","Pioneering compiler technology and popularizing machine-independent programming","Designing the original abacus","Inventing the first vacuum tube"],"answer":1,"explanation":"Hopper worked on early compilers and programming-language development."},{"id":"e6-mc-theory-3","topic":"theory","question":"Which is a classic example of a regular language?","options":["Binary strings ending in 01","Equal numbers of a's followed by b's","All valid programs in every language","Perfectly balanced parentheses at any depth"],"answer":0,"explanation":"A finite automaton can track the last two bits."},{"id":"e6-mc-models-3","topic":"models","question":"Which statement about von Neumann architecture is accurate?","options":["No memory is needed","Instructions and data share a memory address space in the basic model","Only analogue inputs are supported","It prohibits program branching"],"answer":1,"explanation":"The classic model uses one memory for data and instructions."},{"id":"e6-mc-ai-3","topic":"ai","question":"What does a classification model predict?","options":["A DNS server's port","A CPU's physical weight","Only a continuous voltage waveform","A discrete category or label"],"answer":3,"explanation":"Classification assigns inputs to predefined classes."},{"id":"e6-mc-internet-3","topic":"internet","question":"What was Mosaic, released in 1993?","options":["A popular graphical web browser","A mechanical calculator","The first domain-name root server","A vacuum-tube computer"],"answer":0,"explanation":"Mosaic made navigating the Web more accessible."},{"id":"e6-mc-data-3","topic":"data","question":"What is decimal 64 in hexadecimal?","options":["40","4A","100","64"],"answer":0,"explanation":"64 = 4×16 + 0."},{"id":"e6-mc-history-4","topic":"history","question":"Which early stored-program computer first ran a program from electronic memory in 1948?","options":["IBM PC","Colossus Mark I","Manchester Baby","Pascaline"],"answer":2,"explanation":"Manchester Baby demonstrated an electronically stored program in June 1948."},{"id":"e6-mc-data-4","topic":"data","question":"What is octal 20 in decimal?","options":["10","16","20","18"],"answer":1,"explanation":"2×8 + 0 = 16."}],"matching":[{"id":"e6-match-theory-1","topic":"theory","term":"Pushdown automaton","definition":"Machine equipped with stack memory"},{"id":"e6-match-theory-2","topic":"theory","term":"Context-free language","definition":"Language class recognized by nondeterministic pushdown automata"},{"id":"e6-match-data-1","topic":"data","term":"17₈","definition":"Octal representation of decimal fifteen"},{"id":"e6-match-ai-1","topic":"ai","term":"Overfitting","definition":"Poor generalization due to fitting training-specific detail"},{"id":"e6-match-internet-1","topic":"internet","term":"Paul Mockapetris","definition":"Designer of DNS in the early 1980s"},{"id":"e6-match-models-2","topic":"models","term":"Instruction register","definition":"Register holding the current instruction"},{"id":"e6-match-models-1","topic":"models","term":"Program counter","definition":"Register holding the next instruction address"},{"id":"e6-match-ai-2","topic":"ai","term":"Classification","definition":"Predicting one of several categories"},{"id":"e6-match-history-1","topic":"history","term":"Microprocessor","definition":"Processor functionality implemented on a chip"},{"id":"e6-match-history-2","topic":"history","term":"FORTRAN","definition":"Early high-level language for scientific computing"},{"id":"e6-match-internet-2","topic":"internet","term":"Tim Berners-Lee","definition":"Inventor of the World Wide Web at CERN"},{"id":"e6-match-data-2","topic":"data","term":"1F₁₆","definition":"Hexadecimal representation of decimal thirty-one"}],"short":[{"id":"e6-short-1","topic":"models","question":"A switch starts OFF and toggles every time a button is pressed. What is its state after 8 presses? Explain with parity.","model":"OFF, because an even number of presses returns the FSM to its initial state.","rubric":["Correct final state OFF","Explains even toggles return to start"]},{"id":"e6-short-2","topic":"internet","question":"Explain the roles of DNS and HTTP when a user opens a website by domain name.","model":"DNS resolves the domain name to an address (or relevant records). The browser then uses HTTP/HTTPS to request and receive web resources.","rubric":["Describes DNS name resolution","Describes HTTP/HTTPS request/response transfer"]},{"id":"e6-short-3","topic":"data","question":"Convert octal 57 to binary and decimal, and show your method.","model":"57₈ = 101 111₂ = 101111₂ = 5×8 + 7 = 47₁₀.","rubric":["Gives binary 101111","Gives decimal 47 with correct workings"]}]},{"id":"test-7","name":"Mixed Exam Simulation","description":"Tackle a broad exam-style challenge","level":"Advanced","mc":[{"id":"e7-mc-history-1","topic":"history","question":"How did punched cards most often function in early data processing?","options":["They transmitted radio signals","They physically encoded data or instructions as hole patterns","They stored laser-written audio","They held semiconductor transistors"],"answer":1,"explanation":"Hole positions represented information to be read mechanically or electrically."},{"id":"e7-mc-theory-1","topic":"theory","question":"Which task is not generally possible with a finite automaton alone?","options":["Recognizing strings beginning with 0","Recognizing binary strings of even length","Recognizing arbitrary strings of the form a^n b^n","Recognizing strings containing 11"],"answer":2,"explanation":"Counting arbitrary matching numbers requires unbounded memory."},{"id":"e7-mc-models-1","topic":"models","question":"A DFA reading 101 and tracking parity of 1 bits should end in what parity state?","options":["Invalid always","Even","Undefined always","Odd"],"answer":1,"explanation":"The string 101 contains two ones, so its parity is even."},{"id":"e7-mc-ai-1","topic":"ai","question":"What does a regression model ordinarily predict?","options":["A numerical value","A packet header always","A file extension","A state name exclusively"],"answer":0,"explanation":"Regression predicts continuous or numeric outcomes."},{"id":"e7-mc-internet-1","topic":"internet","question":"What was the original research institution behind the Web?","options":["CERN","IBM alone","UCLA alone","NASA alone"],"answer":0,"explanation":"Berners-Lee developed the Web at CERN."},{"id":"e7-mc-data-1","topic":"data","question":"What is binary 11001010 in hexadecimal?","options":["AC","C9","DA","CA"],"answer":3,"explanation":"1100 is C and 1010 is A."},{"id":"e7-mc-history-2","topic":"history","question":"Which limitation is typical of many early mechanical calculators?","options":["They used GPUs for multiplication","They required physical motion and were comparatively slow","They required internet access","They depended on object-oriented software"],"answer":1,"explanation":"Mechanical movement limits speed and reliability compared with electronics."},{"id":"e7-mc-theory-2","topic":"theory","question":"What does Church–Turing thesis propose?","options":["Effectively computable functions can be computed by a Turing machine","Regular languages include every language","All problems have fast algorithms","CPUs must use vacuum tubes"],"answer":0,"explanation":"It relates informal effective calculability to Turing computability."},{"id":"e7-mc-models-2","topic":"models","question":"A two-state FSM toggles OFF to ON on each button press. Starting OFF, where is it after 5 presses?","options":["No state","Both states at once","OFF","ON"],"answer":3,"explanation":"An odd number of toggles switches OFF to ON."},{"id":"e7-mc-ai-2","topic":"ai","question":"What is clustering?","options":["Converting programs into punched cards","Encrypting packets in transit","Changing lowercase letters to uppercase","Grouping similar observations without predefined target labels"],"answer":3,"explanation":"Clustering finds groups based on similarity."},{"id":"e7-mc-internet-2","topic":"internet","question":"When was the Domain Name System introduced in the early Internet era?","options":["2003","1960","1943","1983"],"answer":3,"explanation":"Paul Mockapetris proposed DNS in 1983 through RFCs 882 and 883."},{"id":"e7-mc-data-2","topic":"data","question":"What is hexadecimal FF in decimal?","options":["256","240","225","255"],"answer":3,"explanation":"F×16 + F = 15×16 + 15 = 255."},{"id":"e7-mc-history-3","topic":"history","question":"Which person designed the Harvard Mark I with IBM collaboration?","options":["John Backus","Vint Cerf","Howard Aiken","Dennis Ritchie"],"answer":2,"explanation":"Aiken led the Harvard Mark I project, built with IBM."},{"id":"e7-mc-theory-3","topic":"theory","question":"Why can two algorithms solving the same problem differ significantly?","options":["They must always produce different answers","They may require different amounts of time and memory","Only one can be written in code","Only one can use variables"],"answer":1,"explanation":"Complexity compares efficiency without changing the intended result."},{"id":"e7-mc-models-3","topic":"models","question":"What is an accepting state in a finite automaton?","options":["A state in which ending the input makes the string accepted","A state that requires a printer","The initial state in every machine","Any state with two arrows"],"answer":0,"explanation":"Acceptance depends on ending in a designated accepting state."},{"id":"e7-mc-ai-3","topic":"ai","question":"What is the Turing Test historically intended to evaluate?","options":["Whether a machine's conversational behavior can appear human-like","The correctness of IPv4 routing","How many transistors a CPU contains","Whether a disk is formatted"],"answer":0,"explanation":"Turing proposed an imitation game focused on machine conversation."},{"id":"e7-mc-internet-3","topic":"internet","question":"Who is associated with designing the Domain Name System?","options":["Paul Mockapetris","Ada Lovelace","Grace Hopper","Charles Babbage"],"answer":0,"explanation":"Mockapetris designed DNS in the early 1980s."},{"id":"e7-mc-data-3","topic":"data","question":"Which statement about leading zeros in positional notation is generally true?","options":["They do not change the numeric value","They reverse the digits","They change the number's base automatically","They double the value"],"answer":0,"explanation":"Leading zeros preserve value when the base stays the same."},{"id":"e7-mc-history-4","topic":"history","question":"Which generation saw widespread adoption of operating systems and multiprogramming?","options":["Fifth generation only","First generation only","Third generation","Prehistory of the abacus"],"answer":2,"explanation":"Third-generation systems advanced operating systems and time sharing."},{"id":"e7-mc-data-4","topic":"data","question":"How many bits are needed at minimum to represent 16 distinct symbols with fixed-length binary codes?","options":["8","3","4","16"],"answer":2,"explanation":"Four bits give 2⁴ = 16 distinct combinations."}],"matching":[{"id":"e7-match-internet-1","topic":"internet","term":"1989","definition":"Year of Berners-Lee's Web proposal"},{"id":"e7-match-ai-1","topic":"ai","term":"Regression","definition":"Predicting a numerical quantity"},{"id":"e7-match-history-2","topic":"history","term":"ENIAC","definition":"Early general-purpose electronic digital computer"},{"id":"e7-match-data-1","topic":"data","term":"1101₂","definition":"Binary representation of decimal thirteen"},{"id":"e7-match-theory-2","topic":"theory","term":"NP","definition":"Decision problems with polynomial-time-verifiable certificates"},{"id":"e7-match-models-2","topic":"models","term":"Fetch","definition":"Read an instruction from memory"},{"id":"e7-match-theory-1","topic":"theory","term":"P","definition":"Decision problems solvable in deterministic polynomial time"},{"id":"e7-match-models-1","topic":"models","term":"RAM","definition":"Volatile working memory for running programs"},{"id":"e7-match-history-1","topic":"history","term":"COBOL","definition":"Early language aimed at business data processing"},{"id":"e7-match-data-2","topic":"data","term":"FF₁₆","definition":"Hexadecimal representation of decimal 255"},{"id":"e7-match-internet-2","topic":"internet","term":"HTTP","definition":"Application protocol used to request web resources"},{"id":"e7-match-ai-2","topic":"ai","term":"Clustering","definition":"Grouping observations according to similarity"}],"short":[{"id":"e7-short-1","topic":"history","question":"Compare the Difference Engine and the Analytical Engine in terms of intended function.","model":"The Difference Engine was designed to compute mathematical tables; the Analytical Engine was planned as a general-purpose programmable calculating machine.","rubric":["Identifies the Difference Engine as a table-calculation design","Identifies Analytical Engine as a programmable general-purpose design"]},{"id":"e7-short-2","topic":"internet","question":"Describe packet switching and explain one reason it supports communication over large networks.","model":"Data is split into packets that can travel across network paths and are reassembled; this allows sharing network links efficiently and can support rerouting when paths fail.","rubric":["Explains breaking a message into packets","Explains efficient link-sharing, routing or resilience"]},{"id":"e7-short-3","topic":"data","question":"How many distinct unsigned values can 6 bits encode? State the minimum and maximum unsigned values.","model":"2⁶ = 64 combinations, representing integers 0 through 63.","rubric":["States 64 distinct combinations","States correct range 0–63"]}]},{"id":"test-8","name":"Final Challenge","description":"Finish with a comprehensive readiness check","level":"Advanced","mc":[{"id":"e8-mc-history-1","topic":"history","question":"A microprocessor is best described as what?","options":["A punched card with a program","An analogue adding wheel","A single vacuum tube used as memory","A processor implemented on an integrated circuit"],"answer":3,"explanation":"Microprocessors integrate CPU functionality onto chips."},{"id":"e8-mc-theory-1","topic":"theory","question":"What is the advantage of using abstract models of computation?","options":["They separate fundamental computational ability from specific hardware","They require a special brand of laptop","They guarantee no program errors","They remove mathematical reasoning"],"answer":0,"explanation":"Abstraction lets us reason independently of physical implementation."},{"id":"e8-mc-models-1","topic":"models","question":"In the instruction cycle, which step interprets the fetched opcode?","options":["Input","Decode","Backup","Format"],"answer":1,"explanation":"Decoding determines the operation requested by the instruction."},{"id":"e8-mc-ai-1","topic":"ai","question":"What is generative AI mainly used for?","options":["Replacing decimal with binary","Creating new content such as text, images, or audio","Only counting computer parts","Changing a monitor cable"],"answer":1,"explanation":"Generative models produce content conditioned on inputs."},{"id":"e8-mc-internet-1","topic":"internet","question":"Which invention made web pages reference each other easily?","options":["Magnetic drums","Vacuum tubes","Hypertext links","Mechanical gears"],"answer":2,"explanation":"Hypertext is central to linking web resources."},{"id":"e8-mc-data-1","topic":"data","question":"What is decimal 100 in binary?","options":["1100100","1110000","1100010","1010100"],"answer":0,"explanation":"100 = 64 + 32 + 4."},{"id":"e8-mc-history-2","topic":"history","question":"What improvement followed the transition from vacuum tubes to transistors?","options":["Reduced energy consumption and physical size","Replacement of digital logic with gears","Elimination of all hardware faults","Higher dependence on large cooling rooms"],"answer":0,"explanation":"Transistor-based machines were typically smaller and more efficient."},{"id":"e8-mc-theory-2","topic":"theory","question":"What does NP-complete mean?","options":["A problem is in NP and every NP problem polynomially reduces to it","A problem cannot be expressed in binary","A problem runs only on neural networks","A problem must be solved in one step"],"answer":0,"explanation":"NP-complete problems are among the hardest problems in NP under polynomial-time reductions."},{"id":"e8-mc-models-2","topic":"models","question":"A machine with states Locked and Unlocked receives a coin while Locked. What does a turnstile FSM typically do?","options":["Move to Unlocked","Delete both states","Remain permanently Locked","Enter an infinite number of states"],"answer":0,"explanation":"A valid coin triggers the Locked-to-Unlocked transition."},{"id":"e8-mc-ai-2","topic":"ai","question":"Which practice improves trust in AI-generated factual answers?","options":["Using the longest answer regardless of accuracy","Checking claims against reliable independent sources","Assuming fluent text must be true","Avoiding all evaluation"],"answer":1,"explanation":"Independent verification reduces the impact of hallucinations."},{"id":"e8-mc-internet-2","topic":"internet","question":"Which distinction best describes email and the Web?","options":["Email is an Internet service that predates the Web","Email is a type of ALU","Email requires the Web to exist","The Web predates computer networks"],"answer":0,"explanation":"Networked email developed before Berners-Lee's Web."},{"id":"e8-mc-data-2","topic":"data","question":"What is hexadecimal 10 in decimal?","options":["2","16","10","8"],"answer":1,"explanation":"10₁₆ = 1×16 + 0."},{"id":"e8-mc-history-3","topic":"history","question":"Who is commonly associated with the first published algorithm for a proposed general-purpose computing machine?","options":["Claude Shannon","Herman Hollerith","Ada Lovelace","Blaise Pascal"],"answer":2,"explanation":"Lovelace's notes for Babbage's Analytical Engine include an algorithm."},{"id":"e8-mc-theory-3","topic":"theory","question":"Which statement about the relationship P and NP is established?","options":["No P problem is an NP problem","P is a subset of NP","NP is a subset of P only","P and NP are proven unequal"],"answer":1,"explanation":"Every polynomial-time-solvable decision problem is also verifiable in polynomial time."},{"id":"e8-mc-models-3","topic":"models","question":"What is a significant difference between Harvard and von Neumann architecture models?","options":["Von Neumann forbids RAM","Harvard has no processor","Harvard only uses analogue circuits","Harvard separates instruction and data memory paths"],"answer":3,"explanation":"Harvard architectures provide distinct instruction/data storage or paths."},{"id":"e8-mc-ai-3","topic":"ai","question":"Why should high-stakes AI applications include human oversight?","options":["Models can make harmful mistakes or exhibit bias","Human checks guarantee zero error","AI systems cannot process data","AI outputs are always deterministic"],"answer":0,"explanation":"Human review can catch errors, assess context and provide accountability."},{"id":"e8-mc-internet-3","topic":"internet","question":"Who is commonly credited with popularizing the @ convention for network email addresses in 1971?","options":["Howard Aiken","Tim Berners-Lee","Ray Tomlinson","John Backus"],"answer":2,"explanation":"Ray Tomlinson is credited with pioneering network email on ARPANET."},{"id":"e8-mc-data-3","topic":"data","question":"What is binary 1001 in decimal?","options":["7","10","12","9"],"answer":3,"explanation":"1001₂ = 8 + 1."},{"id":"e8-mc-history-4","topic":"history","question":"Why is the stored-program concept historically significant?","options":["Instructions can reside in memory rather than requiring manual rewiring","It removes the need for a processor","It makes computers purely analogue","It guarantees programs cannot fail"],"answer":0,"explanation":"Storing instructions in addressable memory makes software easier to change."},{"id":"e8-mc-data-4","topic":"data","question":"What is decimal 31 in binary?","options":["10111","11111","11110","11011"],"answer":1,"explanation":"31 = 16 + 8 + 4 + 2 + 1."}],"matching":[{"id":"e8-match-data-2","topic":"data","term":"Nibble","definition":"Group of four bits"},{"id":"e8-match-theory-2","topic":"theory","term":"Church–Turing thesis","definition":"Claim linking effective calculation to Turing computability"},{"id":"e8-match-internet-2","topic":"internet","term":"Ray Tomlinson","definition":"Pioneer of network email and the @ address convention"},{"id":"e8-match-models-1","topic":"models","term":"Decode","definition":"Determine what an instruction means"},{"id":"e8-match-models-2","topic":"models","term":"Execute","definition":"Carry out the instruction's operation"},{"id":"e8-match-ai-2","topic":"ai","term":"Generative AI","definition":"AI capable of producing new content"},{"id":"e8-match-ai-1","topic":"ai","term":"Hallucination","definition":"Generated claim unsupported by reliable evidence"},{"id":"e8-match-data-1","topic":"data","term":"2⁸","definition":"Number of unique patterns possible with eight bits"},{"id":"e8-match-internet-1","topic":"internet","term":"Mosaic","definition":"Graphical web browser popularized in 1993"},{"id":"e8-match-history-1","topic":"history","term":"Grace Hopper","definition":"Pioneer of compiler and programming-language development"},{"id":"e8-match-history-2","topic":"history","term":"Manchester Baby","definition":"Ran a stored program from electronic memory in 1948"},{"id":"e8-match-theory-1","topic":"theory","term":"NP-complete","definition":"In NP and at least as hard as every problem in NP under polynomial reductions"}],"short":[{"id":"e8-short-1","topic":"theory","question":"Give the difference between decidable and undecidable problems, using the Halting Problem as an example.","model":"Decidable problems have an algorithm that terminates with the correct answer on all inputs. The general Halting Problem is undecidable: no such algorithm exists for every program/input.","rubric":["Defines decidable problems as algorithmically solvable on every valid input","Correctly identifies the general Halting Problem as undecidable"]},{"id":"e8-short-2","topic":"models","question":"Describe the roles of the ALU and RAM in a von Neumann computer.","model":"The ALU carries out arithmetic and logic; RAM holds the running program instructions and data that the processor uses.","rubric":["Correct function of ALU","Correct function of RAM"]},{"id":"e8-short-3","topic":"ai","question":"Why should an AI-generated answer be checked before it is used in a medical or legal decision? Give two reasons.","model":"It may hallucinate false information and may reflect bias or omit critical context; expert verification and human oversight are essential.","rubric":["Gives a substantive risk such as hallucination or factual error","Gives a second distinct risk or describes appropriate independent verification/oversight"]}]}]};

<script>

 const a=attemptFor(e.id),answeredN=progressFor(e),submitted=a?.status==='submitted';const pct=Math.round(answeredN/35*100);

 }).join('');

function renderMc(e,a){return `<div class="section-lead"><div><h2>Part A — Multiple choice</h2><p>Choose one answer for each question.</p></div><span class="section-tag">20 points</span></div>`+e.mc.map((q,i)=>`<article class="question-card" id="q-${q.id}"><div class="q-head"><span class="q-number">QUESTION ${String(i+1).padStart(2,'0')} / 35</span>${tag(q.topic)}</div><h3 class="q-text">${esc(q.question)}</h3><div class="options" role="group" aria-label="Question ${i+1}">${q.options.map((op,j)=>`<button type="button" class="option ${String(a.answers.mc[q.id])===String(j)?'selected':''}" data-action="answer-mc" data-q="${q.id}" data-value="${j}" aria-pressed="${String(a.answers.mc[q.id])===String(j)}"><span class="option-letter">${LETTERS[j]}</span><span>${esc(op)}</span></button>`).join('')}</div></article>`).join('')}
function renderMatching(e,a){const defs=defsFor(e);return `<div class="section-lead"><div><h2>Part B — Matching</h2><p>Match each term with one definition (A–L). Use each letter once.</p></div><span class="section-tag">12 points</span></div><div class="definitions"><h3>Definition bank</h3><div class="def-grid">${defs.map((d,i)=>`<div class="def-item"><strong>${LETTERS[i]}</strong><span>${esc(d.definition)}</span></div>`).join('')}</div></div><article class="question-card">${e.matching.map((m,i)=>`<div id="q-${m.id}" class="match-row"><span class="match-idx">${i+21}.</span><div><span class="match-term">${esc(m.term)}</span><span class="match-topic">${esc(topic(m.topic))}</span></div><select aria-label="Match ${esc(m.term)}" class="match-select" data-match="${m.id}"><option value="">—</option>${defs.map((d,j)=>`<option value="${d.id}" ${a.answers.matching[m.id]===d.id?'selected':''}>${LETTERS[j]}</option>`).join('')}</select></div>`).join('')}</article>`}
function renderShort(e,a){return `<div class="section-lead"><div><h2>Part C — Short answers</h2><p>Explain your reasoning; show workings for number conversions.</p></div><span class="section-tag">6 points</span></div><div class="notice-card" style="margin-top:0;margin-bottom:15px">Short answers are <strong>self-marked after submission</strong> using two criteria per question. You can earn 0, 1, or 2 points for each answer.</div>`+e.short.map((q,i)=>`<article class="question-card" id="q-${q.id}"><div class="q-head"><span class="q-number">QUESTION ${33+i} / 35</span>${tag(q.topic)}</div><h3 class="q-text">${esc(q.question)}</h3><textarea class="short-input" rows="5" placeholder="Write your answer here. Include your working where appropriate..." aria-label="Answer to question ${33+i}" data-short="${q.id}">${esc(a.answers.short[q.id]||'')}</textarea><div class="answer-helper"><span>Short-answer response</span><span id="len-${q.id}">${(a.answers.short[q.id]||'').length} characters</span></div></article>`).join('')}
function startTimer(a){function tick(){if(state.view!=='exam')return;const left=Math.max(0,Math.ceil((a.deadline-Date.now())/1000)),node=document.getElementById('timer');if(node){node.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;node.classList.toggle('low',left<=300)}if(left===0)finish(true)}tick();timerId=setInterval(tick,1000)}
function updateAnsweredUI(){const e=examFor(state.id),a=attemptFor(state.id);if(!a||!e)return;const total=totalAnswered(a,e);const t=document.getElementById('top-progress');if(t)t.textContent=`${total} / 35 answered`;const prog=document.querySelector('.exam-progress');if(prog){prog.setAttribute('aria-valuenow',total);prog.querySelector('div').style.width=`${total/35*100}%`}
 for(const section of ['mc','matching','short']){const x=count(a,section,e),b=document.getElementById(`tab-${section}`),s=document.getElementById(`side-${section}-count`);if(b)b.textContent=`${x}/${arraysFor(e,section).length}`;if(s)s.textContent=`${x} / ${arraysFor(e,section).length}`;}
 for(const q of [...e.mc,...e.matching,...e.short]){const dot=document.querySelector(`[data-dotid="${q.id}"]`);if(dot){let sect=q.id.includes('-mc-')?'mc':q.id.includes('-match-')?'matching':'short';dot.classList.toggle('filled',answered(a,sect,q.id))}}

function finish(auto=false){const a=attemptFor(state.id),e=examFor(state.id);if(!a||a.status==='submitted'||!e)return;const n=35-totalAnswered(a,e);if(!auto&&n&& !window.confirm(`You have ${n} unanswered question${n===1?'':'s'}. Submit anyway? You cannot change answers after submission.`))return;
 a.status='submitted';a.completedAt=Date.now();a.autoSubmitted=auto;save();goto('result',e.id);

function calc(e,a){let mc=0,matching=0;const topicStats=Object.fromEntries(order.map(k=>[k,{correct:0,total:0}]));for(const q of e.mc){const correct=a.answers.mc[q.id]===q.answer;if(correct)mc++;topicStats[q.topic].total++;if(correct)topicStats[q.topic].correct++}
 for(const q of e.matching){const correct=a.answers.matching[q.id]===q.id;if(correct)matching++;topicStats[q.topic].total++;if(correct)topicStats[q.topic].correct++}
 const scores=e.short.map(q=>Number.isInteger(a.marks[q.id])?a.marks[q.id]:null);const marked=scores.filter(n=>n!==null).length,shorts=scores.reduce((t,n)=>t+(n??0),0);return {mc,matching,auto:mc+matching,shorts,marked,full:marked===3,total:mc+matching+shorts,topicStats};
}

function thisReview(e,a,filter){const rows=[];
 if(filter!=='short'){
 e.mc.forEach((q,i)=>{const chosen=a.answers.mc[q.id],ok=chosen===q.answer;if(filter==='missed'&&ok)return;const answer=chosen===undefined?'Not answered':`${LETTERS[chosen]}. ${q.options[chosen]}`;rows.push(`<article class="review-card ${ok?'good':'bad'}"><div class="q-head"><span class="q-number">QUESTION ${i+1} • ${ok?'CORRECT':'INCORRECT'}</span>${tag(q.topic)}</div><h3>${esc(q.question)}</h3><div class="review-answer ${ok?'correct':'incorrect'}">Your answer: ${esc(answer)}</div>${!ok?`<div class="review-answer correct">Correct answer: ${LETTERS[q.answer]}. ${esc(q.options[q.answer])}</div>`:''}<p class="explain"><strong>Why:</strong> ${esc(q.explanation)}</p></article>`)});
 e.matching.forEach((q,i)=>{const chosen=a.answers.matching[q.id],ok=chosen===q.id;if(filter==='missed'&&ok)return;const selected=defsFor(e).find(x=>x.id===chosen);rows.push(`<article class="review-card ${ok?'good':'bad'}"><div class="q-head"><span class="q-number">QUESTION ${i+21} • ${ok?'CORRECT':'INCORRECT'}</span>${tag(q.topic)}</div><h3>Match: ${esc(q.term)}</h3><div class="review-answer ${ok?'correct':'incorrect'}">Your match: ${selected?`${letterFor(e,selected.id)}. ${esc(selected.definition)}`:'Not answered'}</div>${!ok?`<div class="review-answer correct">Correct match: ${letterFor(e,q.id)}. ${esc(q.definition)}</div>`:''}</article>`)});
 }
 if(filter==='short'||filter==='all')e.short.forEach((q,i)=>{const mark=a.marks[q.id];const hasMark=Number.isInteger(mark);rows.push(`<article class="review-card short" id="review-${q.id}"><div class="q-head"><span class="q-number">QUESTION ${i+33} • ${hasMark?`${mark} / 2 MARKS`:'SELF-MARK'}</span>${tag(q.topic)}</div><h3>${esc(q.question)}</h3><div class="review-answer"><b>Your response:</b> ${a.answers.short[q.id]?`<span style="white-space:pre-wrap">${esc(a.answers.short[q.id])}</span>`:'Not answered'}</div><div class="review-answer correct"><b>Model answer:</b> ${esc(q.model)}</div><ul class="rubric-list">${q.rubric.map((r,k)=>`<li><span><b>Point ${k+1}:</b> ${esc(r)}</span></li>`).join('')}</ul><div class="mark-panel"><strong>How many criteria did your answer meet?</strong><div class="mark-options" role="group" aria-label="Self-mark question ${i+33}">${[0,1,2].map(n=>`<button class="${mark===n?'active':''}" data-action="mark" data-q="${q.id}" data-mark="${n}" aria-pressed="${mark===n}">${n}</button>`).join('')}</div></div></article>`)});
 return rows.length?rows.join(''):`<div class="empty-note"><h3>Nothing to review here.</h3><p>All your automatically marked answers were correct. Open “Short answers” to mark your written work, or “All questions” to read explanations.</p><button class="ghost-button" data-action="filter" data-filter="short">Go to short answers →</button></div>`
}

 if(t.matches('[data-match]')){const a=attemptFor(state.id);if(!a||a.status!=='in-progress')return;const q=t.dataset.match;if(t.value)a.answers.matching[q]=t.value;else delete a.answers.matching[q];save();updateAnsweredUI();return}
});
root.addEventListener('input',e=>{const t=e.target;if(t.matches('[data-short]')){const a=attemptFor(state.id);if(!a||a.status!=='in-progress')return;a.answers.short[t.dataset.short]=t.value;save();const label=document.getElementById('len-'+t.dataset.short);if(label)label.textContent=t.value.length+' characters';updateAnsweredUI();}});
function init(){const hash=location.hash.slice(1),[view,id]=hash.split('/');if(['exam','intro','result'].includes(view)&&examFor(id)){state.view=view;state.id=id;}render()}
window.addEventListener('hashchange',()=>{const [view,id]=location.hash.slice(1).split('/');if(view==='home'&&state.view!=='home'){state.view='home';state.id=null;render()}else if(['exam','intro','result'].includes(view)&&examFor(id)&& (state.view!==view||state.id!==id)){state.view=view;state.id=id;render()}});
init();
})();

</script>
